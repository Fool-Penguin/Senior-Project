<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #1e293b;
            --accent-cyan: #06b6d4;
            --accent-blue: #3b82f6;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar Navigation */
        .sidebar {
            width: 320px;
            background: #0f172a;
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 18px 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .sidebar-header h1 {
            font-size: 1.25rem;
            color: var(--accent-cyan);
            font-weight: 700;
        }

        .sidebar-header p {
            font-size: 0.75rem;
            color: var(--text-sub);
            margin-top: 4px;
        }

        .timer-card {
            background: #1e293b;
            border-radius: 8px;
            padding: 12px 16px;
            margin: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px solid var(--border-color);
        }

        .timer-display {
            font-size: 1.5rem;
            font-family: monospace;
            font-weight: bold;
            color: var(--accent-green);
        }

        .timer-ctrls button {
            background: var(--accent-cyan);
            color: #000;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.8rem;
        }

        .timer-ctrls button:hover {
            opacity: 0.9;
        }

        .slide-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px 12px;
        }

        .slide-item {
            padding: 10px 12px;
            border-radius: 6px;
            margin-bottom: 6px;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid transparent;
            font-size: 0.85rem;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .slide-item:hover {
            background: #1e293b;
        }

        .slide-item.active {
            background: rgba(6, 182, 212, 0.15);
            border-color: var(--accent-cyan);
            color: var(--accent-cyan);
        }

        .speaker-badge {
            font-size: 0.7rem;
            font-weight: bold;
            display: inline-block;
            padding: 2px 6px;
            border-radius: 4px;
            width: fit-content;
        }

        .badge-ongsa { background: #0369a1; color: #fff; }
        .badge-peem { background: #047857; color: #fff; }
        .badge-brook { background: #b45309; color: #fff; }

        /* Main Stage View */
        .main-stage {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .topbar {
            height: 60px;
            background: #0f172a;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
        }

        .topbar .info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .topbar .title {
            font-weight: bold;
            font-size: 1.1rem;
        }

        .topbar .actions button {
            background: #334155;
            color: var(--text-main);
            border: none;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            margin-left: 8px;
        }

        .topbar .actions button.active {
            background: var(--accent-cyan);
            color: #000;
            font-weight: bold;
        }

        .content-area {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        /* Slide Preview Area */
        .slide-preview-pane {
            flex: 1.2;
            padding: 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .slide-card-screen {
            width: 100%;
            max-width: 900px;
            aspect-ratio: 16 / 9;
            background: #020617;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            padding: 36px 44px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            position: relative;
        }

        .slide-tag {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--accent-cyan);
            font-weight: bold;
            margin-bottom: 8px;
        }

        .slide-main-title {
            font-size: 1.75rem;
            font-weight: 800;
            line-height: 1.3;
            color: #ffffff;
            margin-bottom: 24px;
        }

        .slide-body-grid {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 16px;
            align-content: start;
        }

        .slide-card-item {
            background: #0f172a;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 16px;
        }

        .slide-card-item h4 {
            color: var(--accent-cyan);
            font-size: 0.95rem;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .slide-card-item ul {
            list-style: none;
            padding-left: 0;
            font-size: 0.85rem;
            color: #cbd5e1;
            line-height: 1.5;
        }

        .slide-card-item li {
            margin-bottom: 6px;
            position: relative;
            padding-left: 14px;
        }

        .slide-card-item li::before {
            content: "•";
            position: absolute;
            left: 0;
            color: var(--accent-cyan);
            font-weight: bold;
        }

        .slide-footer-bar {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: var(--text-sub);
            border-top: 1px solid rgba(255,255,255,0.1);
            padding-top: 12px;
            margin-top: 16px;
        }

        /* Teleprompter / Script Pane */
        .script-pane {
            flex: 0.8;
            background: #0f172a;
            border-left: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
        }

            padding: 16px 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .script-header h3 {
            font-size: 0.95rem;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .script-body {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            font-size: 1.15rem;
            line-height: 1.8;
            color: #f1f5f9;
        }

        .script-body p {
            margin-bottom: 16px;
        }

        .script-body strong {
            color: var(--accent-cyan);
        }

        .nav-controls {
            padding: 14px 20px;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            background: #090d16;
        }

        .nav-controls button {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        .nav-controls button:hover {
            border-color: var(--accent-cyan);
            color: var(--accent-cyan);
        }

        /* Q&A Modal / Drawer */
        .qa-drawer {
            display: none;
            position: fixed;
            top: 0;
            right: 0;
            width: 480px;
            height: 100vh;
            background: #0f172a;
            border-left: 2px solid var(--accent-cyan);
            box-shadow: -10px 0 30px rgba(0,0,0,0.7);
            z-index: 100;
            flex-direction: column;
        }

        .qa-drawer.open {
            display: flex;
        }

        .qa-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .qa-header h3 {
            color: var(--accent-cyan);
            font-size: 1rem;
        }

        .qa-close {
            background: transparent;
            border: none;
            color: var(--text-sub);
            font-size: 1.2rem;
            cursor: pointer;
        }

        .qa-list {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }

        .qa-item {
            background: #1e293b;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            margin-bottom: 12px;
            overflow: hidden;
        }

        .qa-q {
            padding: 12px 14px;
            font-weight: bold;
            font-size: 0.85rem;
            cursor: pointer;
            background: #243248;
            display: flex;
            justify-content: space-between;
        }

        .qa-a {
            padding: 14px;
            font-size: 0.85rem;
            line-height: 1.6;
            color: #cbd5e1;
            border-top: 1px solid var(--border-color);
            display: none;
        }

        .qa-a.visible {
            display: block;
        }
    </style>
</head>

    <script>
        const SLIDES = [
            {
                id: 1,
                speaker: "Ongsa",
                badgeClass: "badge-ongsa",
                time: "00:00 - 01:00 (1.0 min)",
                tag: "TITLE & OPENING",
                title: "CodeDEE: An In-Editor Dual-Lens Engine for Continuous Maintainability and Neuro-Symbolic Security Program Repair",
                cards: [
                    { title: "Senior Project I Proposal", items: ["Faculty of Information and Communication Technology", "Mahidol University (Academic Year 2026)"] },
                    { title: "Investigators & Advisor", items: ["Student Investigators: Ongsa, Thanadon, Brook", "Advisor: Assoc. Prof. Dr. Kookaip"] },
                    { title: "Core Innovations", items: ["Multi-Paradigm Concrete Syntax Tree (CST) Parsing", "ISO/IEC 25010 8-Metric Maintainability Suite", "Privacy-Preserving On-Device RAG + Local SLMs", "Closed-Loop 4-Gate Automated Program Repair (APR)"] }
                ],
                script: `Good morning, respected committee members and advisor. Today, my team members—Thanadon, Brook, and I—are proud to present our capstone project: <strong>'CodeDEE: An In-Editor Dual-Lens Engine for Continuous Maintainability and Neuro-Symbolic Security Program Repair.'</strong><br><br>In modern web development across Python, JavaScript, and TypeScript, development speed often compromises software quality. Developers are caught between legacy static analysis tools that overwhelm them with false alarms and emerging AI assistants that generate hallucinated, unverifiable code. CodeDEE solves this by unifying symbolic concrete syntax tree parsing with local retrieval-augmented language models right inside the code editor. Let's begin by examining why today's developer workflow is fundamentally broken.`
            },
            {
                id: 2,
                speaker: "Ongsa",
                badgeClass: "badge-ongsa",
                time: "01:00 - 02:00 (1.0 min)",
                tag: "PROBLEM MOTIVATION",
                title: "The Developer's Dilemma: The Dual Crisis in Modern Web Engineering",
                cards: [
                    { title: "1. Pre-Commit Visibility Gap", items: ["Technical debt accumulates invisibly during active typing.", "CI/CD checks evaluate code hours or days later.", "Cost of refactoring increases 10x once merged."] },
                    { title: "2. SAST Alert Fatigue", items: ["Traditional SAST tools suffer 30%+ false positive rates.", "No actionable, contextual repairs provided.", "Developers ignore up to 80% of static analysis alerts (Johnson et al., ICSE)."] },
                    { title: "3. The AI Hallucination Trap", items: ["Commercial AI tools (Copilot, Cursor) operate without formal semantic grounding.", "Up to 40% of LLM-generated code contains latent security flaws (Pearce et al., S&P).", "Fixes frequently break syntax or introduce subtler bugs."] }
                ],
                script: `Developers face three interconnected crises. First, the <strong>'Pre-Commit Visibility Gap'</strong>: maintainability metrics like Cyclomatic Complexity and Module Coupling are typically computed late in CI/CD pipelines. By the time a developer sees a SonarQube report, their mental context has shifted, making refactoring ten times more expensive.<br><br>Second, <strong>'Alert Fatigue'</strong>: empirical studies by Johnson et al. at ICSE prove that developers ignore up to 80% of static analysis alerts because of high false positive rates and the total lack of actionable fix suggestions.<br><br>Third, when developers turn to modern LLM assistants like GitHub Copilot, they fall into the <strong>'Hallucination Trap'</strong>. Unconstrained LLMs frequently generate code that looks convincing but fails syntax checks or introduces subtle security regressions. Developers need a tool that bridges deterministic analysis with intelligent repair right inside their editor.`
            },
            {
                id: 3,
                speaker: "Ongsa",
                badgeClass: "badge-ongsa",
                time: "02:00 - 03:00 (1.0 min)",
                tag: "STATE OF THE ART",
                title: "Competitive Positioning: Where Existing Tools Fall Short",
                cards: [
                    { title: "Existing Tool Paradigms", items: ["SonarQube / SQALE: Comprehensive metrics, but operates strictly as a delayed CI gate with zero automated repair.", "Semgrep / CodeQL: Powerful pattern matching, but high alert fatigue and no multi-gate patch verification.", "GitHub Copilot Autofix: Cloud-dependent closed source; leaks private intellectual property to external servers."] },
                    { title: "The CodeDEE Breakthrough", items: ["In-Editor & Sub-Second: Concrete Syntax Tree parsing executes continuously as the developer types.", "Dual-Lens Synthesis: Combines ISO/IEC 25010 maintainability with CWE security auditing.", "Air-Gapped Privacy: On-device quantized SLMs run locally via Ollama.", "Closed-Loop Multi-Gate Verification: Candidate patches are verified against syntax, taint, and regression gates."] }
                ],
                script: `When we survey the state of the art, we observe a polarized ecosystem. On the left, enterprise SAST engines like SonarQube and CodeQL excel at deterministic rule enforcement, but they remain isolated in CI pipelines and offer no automated fix synthesis. On the other extreme, cloud-based AI tools like GitHub Copilot Autofix offer remediation, but they violate enterprise privacy by sending proprietary code to third-party cloud servers, and they lack local deterministic verification.<br><br>CodeDEE occupies the vacant, high-value intersection: continuous, in-editor execution; dual-lens maintainability and security; local privacy-preserving SLM reasoning; and closed-loop multi-gate patch validation. Let us examine how CodeDEE's architecture accomplishes this.`
            },
            {
                id: 4,
                speaker: "Ongsa",
                badgeClass: "badge-ongsa",
                time: "03:00 - 04:00 (1.0 min)",
                tag: "PROPOSED ARCHITECTURE",
                title: "The CodeDEE Architecture: Unified Dual-Lens In-Editor Engine",
                cards: [
                    { title: "Core Multi-Language Parser", items: ["Tree-sitter Concrete Syntax Tree (CST) engine.", "Multi-language: Python, JavaScript, TypeScript.", "Incremental, error-tolerant parsing of incomplete code.", "Constructs CFG, DFG, and Call Graph via NetworkX in memory."] },
                    { title: "Lens 1: Maintainability Engine", items: ["Standardized under ISO/IEC 25010 Quality Model.", "Evaluates 8 distinct structural metrics in real time.", "Instant visual feedback on Cyclomatic & Cognitive Complexity.", "Computes Efferent & Afferent Module Coupling to catch architectural rot."] },
                    { title: "Lens 2: Neuro-Symbolic Security", items: ["Symbolic Taint Analysis tracks sources and sinks across 26 CWEs.", "Dense ChromaDB Vector Store with 84 verified CWE remediation records.", "Local Small Language Models (SLMs) generate grounded, context-aware patches.", "4-Gate Sandbox Verifier validates syntax, taint removal, and maintainability."] }
                ],
                script: `CodeDEE is architectured as an in-editor dual-lens engine built on top of a multi-language parsing foundation. At its core, Tree-sitter incrementally parses code into a Concrete Syntax Tree, meaning it maintains full source fidelity and parses incomplete, in-progress code without crashing.<br><br>From this parsed representation, CodeDEE activates two complementary lenses. Lens 1 is our Maintainability Engine: it evaluates eight structural metrics mapped to ISO/IEC 25010 to provide instantaneous pre-commit quality analytics. Lens 2 is our Neuro-Symbolic Security Engine: it uses symbolic taint walking to identify vulnerable flows across 26 CWE classes, grounds a local Small Language Model with verified ChromaDB RAG remediation patterns, and validates candidate fixes through a 4-gate verification pipeline. Let's inspect our project objectives and scope.`
            },
            {
                id: 5,
                speaker: "Ongsa",
                badgeClass: "badge-ongsa",
                time: "04:00 - 05:00 (1.0 min)",
                tag: "PROJECT OBJECTIVES & SCOPE",
                title: "Target Deliverables for Semester 1 & Semester 2",
                cards: [
                    { title: "Primary Project Objectives", items: ["1. In-Editor Dual-Lens Engine: Continuous analysis within sub-second response latency inside VS Code.", "2. Standardize Maintainability Suite: Implement 8 ISO/IEC 25010 metrics across Python, JS, and TS.", "3. Privacy-Preserving Security Pipeline: Symbolic taint walking + ChromaDB RAG + local SLMs via Ollama.", "4. Multi-Gate Verifier: Reject hallucinated or regressive fixes using syntax, taint, and complexity gates.", "5. Empirical Benchmark & SLM Evaluation: 957 cleansed vulnerability samples evaluated across 9 models."] },
                    { title: "Defined Project Scope", items: ["Target Languages: Python, JavaScript, TypeScript (>60% of modern web apps).", "Hardware Constraint: Consumer-grade hardware (NVIDIA RTX GPUs <=16 GB VRAM).", "Vulnerability Coverage: 26 CWE classifications spanning OWASP Top 10 Web and LLM Applications.", "Air-Gapped Privacy: 100% on-device local execution; zero proprietary code transmitted to cloud."] }
                ],
                script: `Our project objectives are tightly scoped and measurable. In Semester 1, our primary milestones were curating an authentic multi-language vulnerability benchmark, implementing the core parsing and maintainability suite, designing the ChromaDB RAG architecture, and systematically evaluating nine local SLMs to discover the optimal deployment model under strict consumer hardware constraints.<br><br>Our project strictly focuses on Python, JavaScript, and TypeScript, and guarantees 100% air-gapped local execution without transmitting a single token of code to the cloud. I will now hand the floor to Thanadon to dive into the theoretical background and methodology of our two lenses.`
            },
            {
                id: 6,
                speaker: "Thanadon",
                badgeClass: "badge-peem",
                time: "05:00 - 06:15 (1.25 min)",
                tag: "THEORETICAL FOUNDATIONS",
                title: "Concrete Syntax Trees vs. AST & Intermediate Graph Modeling",
                cards: [
                    { title: "CST vs. Traditional AST (Tree-sitter)", items: ["AST Fragility: Standard compilers (Python ast, Babel) discard comments, whitespace, and punctuation; fail completely on syntax errors during active typing.", "Concrete Syntax Tree (CST): Preserves 100% of concrete tokens, byte offsets, and trivia necessary for non-destructive code refactoring.", "Incremental GLR Parsing: Reparses only modified subtrees in sub-millisecond time ($O(\\log N)$ vs $O(N)$ reparse).", "Polyglot Query Language: Unified S-expression queries work uniformly across Python, JS, and TS."] },
                    { title: "Intermediate Graphs (NetworkX)", items: ["Control-Flow Graph (CFG): Directed graph $G_{CFG} = (V, E)$ modeling execution branch points (if, while, for, catch) for McCabe Complexity.", "Data-Flow Graph (DFG): Models variable definition-use chains ($def \\to use$) essential for tracing untrusted inputs into sinks.", "Call Graph (CG): Directed inter-procedural graph linking function invocations to declarations across modules."] }
                ],
                script: `Thank you, Ongsa. To understand why CodeDEE operates so effectively inside the code editor, we must look at how we represent code. Traditional linters rely on Abstract Syntax Trees. But ASTs have a fatal flaw for interactive development: they discard whitespace and comments, and if the developer has a temporary syntax error—such as an unclosed parenthesis—the entire parser crashes.<br><br>CodeDEE solves this by using Tree-sitter's Concrete Syntax Tree (CST) paradigm. CSTs retain every single byte, comment, and token, and utilize generalized LR error-recovery to parse incomplete code without crashing. Furthermore, Tree-sitter performs incremental parsing in sub-millisecond time. From this CST, we synthesize three in-memory graph structures via NetworkX: the Control-Flow Graph for decision logic, the Data-Flow Graph for def-use tracing, and the Call Graph for inter-procedural mapping. Let's see how Lens 1 uses this to compute maintainability.`
            },
            {
                id: 7,
                speaker: "Thanadon",
                badgeClass: "badge-peem",
                time: "06:15 - 07:30 (1.25 min)",
                tag: "METHODOLOGY - LENS 1",
                title: "Lens 1: Standardized Multi-Paradigm Maintainability Engine",
                cards: [
                    { title: "Cognitive & Branch Complexity", items: ["McCabe Cyclomatic Complexity (CC): $M = E - N + 2P$, measuring linearly independent execution paths.", "Campbell's Cognitive Complexity: Penalizes nested conditionals, breaks in linear flow, and recursive loops.", "Visual In-Editor Highlighting: Flags high-complexity functions before commit."] },
                    { title: "Volume & Sizing Metrics", items: ["Source Lines of Code (SLOC): Filtered logical executable lines excluding comments and blanks.", "Halstead Volume ($V$): Information-theoretic size based on distinct operators and operands.", "Maintainability Index (MI): Standard composite: $171 - 5.2\\ln V - 0.23 CC - 16.2\\ln SLOC$."] },
                    { title: "Modularity & Coupling Metrics", items: ["Efferent Coupling ($C_e$): Number of outgoing external module dependencies.", "Afferent Coupling ($C_a$): Number of incoming dependent modules.", "Instability Factor ($I$): $I = C_e / (C_a + C_e)$, detecting fragile, tightly coupled modules."] }
                ],
                script: `Lens 1 is our Maintainability Engine, formally mapped to the ISO/IEC 25010 Quality Model. Rather than reporting a single arbitrary score, CodeDEE computes an eight-metric maintainability suite grouped into three critical dimensions.<br><br>First, Cognitive and Branch Complexity: we compute both McCabe Cyclomatic Complexity from the CFG and Campbell Cognitive Complexity, which specifically penalizes deep nesting that exhausts human working memory. Second, Volume and Sizing: we measure executable SLOC, Halstead Volume, and the composite Maintainability Index. Third, Modularity and Coupling: by traversing import declarations across the project, we compute Efferent and Afferent coupling to identify architectural instability. All eight metrics execute in under 15 milliseconds per file, giving developers instantaneous feedback. Now let's explore Lens 2: our security audit pipeline.`
            },

            if (currentSlideIdx < SLIDES.length - 1) {

            if (currentSlideIdx > 0) {
                goToSlide(currentSlideIdx - 1);

            if (e.key === "ArrowRight" || e.key === "PageDown" || e.key === " ") {

                prevSlide();
            }

            const s = timerSeconds % 60;
            const el = document.getElementById("timer");

            } else {
